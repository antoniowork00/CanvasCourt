<script>

    const visual = document.querySelector(".error-visual");
    const found = document.querySelector(".found-wrapper");

    const desktopPointer = window.matchMedia(
        "(min-width: 1051px) and (pointer: fine)"
    );

    if (
        visual &&
        found &&
        desktopPointer.matches
    ) {

        visual.addEventListener(
            "mousemove",
            (event) => {

                const rect =
                    visual.getBoundingClientRect();

                const x =
                    event.clientX - rect.left;

                const y =
                    event.clientY - rect.top;

                const centerX =
                    rect.width / 2;

                const centerY =
                    rect.height / 2;

                const moveX =
                    (x - centerX) / 40;

                const moveY =
                    (y - centerY) / 40;

                found.style.transform =
                    `translate3d(
                        ${moveX}px,
                        ${moveY}px,
                        0
                    )`;

            }
        );

        visual.addEventListener(
            "mouseleave",
            () => {

                found.style.transform =
                    "translate3d(0, 0, 0)";

            }
        );

    }

</script>
